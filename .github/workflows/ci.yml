name: CI — Test & Build

on:
  push:
    branches: [main, staging, develop, "feature/**"]
  pull_request:
    branches: [main, staging, develop]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://sponsorbridge_ci:sponsorbridge_ci_password@127.0.0.1:3306/sponsorbridge_ci

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sponsorbridge_ci
          MYSQL_USER: sponsorbridge_ci
          MYSQL_PASSWORD: sponsorbridge_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply disposable database migrations
        run: pnpm drizzle-kit migrate

      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: Run unit tests
        run: pnpm test
        env:
          JWT_SECRET: test-jwt-secret-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://auth.manus.im
          BUILT_IN_FORGE_API_URL: https://api.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://api.manus.im

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:smoke
        env:
          CI: true
          JWT_SECRET: test-jwt-secret-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://auth.manus.im
          BUILT_IN_FORGE_API_URL: https://api.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://api.manus.im

      - name: Run credentialed browser smoke tests
        if: ${{ secrets.E2E_TEST_PASSWORD != '' }}
        run: pnpm test:smoke:authenticated
        env:
          CI: true
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          JWT_SECRET: test-jwt-secret-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://auth.manus.im
          BUILT_IN_FORGE_API_URL: https://api.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://api.manus.im

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      - name: Build production bundle
        run: pnpm build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL }}
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}
          VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY }}
          VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
