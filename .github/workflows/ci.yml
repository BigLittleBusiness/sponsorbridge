name: CI — Test & Build

on:
  push:
    branches: [main, staging, develop, "feature/**"]
  pull_request:
    branches: [main, staging, develop]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: test-jwt-secret-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://auth.manus.im
          BUILT_IN_FORGE_API_URL: https://api.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://api.manus.im

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:smoke
        env:
          CI: true
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: test-jwt-secret-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://auth.manus.im
          BUILT_IN_FORGE_API_URL: https://api.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://api.manus.im

      - name: Run credentialed browser smoke tests
        if: ${{ secrets.E2E_TEST_PASSWORD != '' && secrets.DATABASE_URL != '' }}
        run: pnpm test:smoke:authenticated
        env:
          CI: true
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          JWT_SECRET: test-jwt-secret-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://auth.manus.im
          BUILT_IN_FORGE_API_URL: https://api.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://api.manus.im

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      - name: Build production bundle
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL }}
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}
          VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY }}
          VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
